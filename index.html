<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAUNTED HOUSE — Cursed Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
:root{--bg:#0d0b0a;--bg2:#241710;--panel:#17110e;--edge:#050403;--line:#42301f;--fg:#eadfc8;--mut:#a08d72;--gold:#c9a14a;--win:#7fb98a;--bad:#d8554c;--ink:#0b0908;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){--bg:#0d0b0a;--bg2:#241710;--panel:#17110e;--edge:#050403;--line:#42301f;--mut:#a08d72}
:root[data-theme="dark"]{--bg:#0d0b0a;--bg2:#241710;--panel:#17110e;--edge:#050403;--line:#42301f;--mut:#a08d72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.4 Fredoka,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(45% 45% at 25% 25%,rgba(122,28,20,.32),transparent 70%),radial-gradient(40% 40% at 80% 70%,rgba(201,161,74,.12),transparent 70%),radial-gradient(55% 55% at 50% 10%,rgba(0,0,0,.55),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 30%,rgba(0,0,0,.72) 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
@keyframes drift{to{transform:translate(5%,3%) rotate(7deg) scale(1.1)}}
#app{max-width:560px;margin:0 auto;padding:12px 12px 44px}body.room #app{padding-bottom:104px}
h1{font:700 22px Cinzel,Georgia,serif;margin:0;letter-spacing:.4px}
.head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 12px}.rd{font-size:13px;color:var(--mut)}
.win{color:var(--win)}.lose{color:var(--bad)}
/* jokers */
.js{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:8px;padding:12px 10px;background:rgba(0,0,0,.28);border-radius:20px;box-shadow:inset 0 3px 8px rgba(0,0,0,.5)}
.jk{position:relative;aspect-ratio:5/7;border-radius:10px;background:linear-gradient(160deg,#2a2018,#120d0a);color:#eadfc8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.6);border:2px solid #42301f;transition:transform .25s cubic-bezier(.34,1.5,.5,1)}
.jk .em{font-size:26px;line-height:1}.jk b{font-size:9.5px;line-height:1.1;text-align:center;font-weight:600}
.jk.bl{border-color:#2fbf6a}.jk.cu{border-color:#e0443a}
.jk:hover,.jk.on{transform:translateY(-5px) rotate(-2.5deg)}
.jk i{position:absolute;top:-7px;right:-7px;background:var(--gold);color:#2a1c00;border-radius:50%;width:19px;height:19px;font:700 11px/19px Fredoka,sans-serif;text-align:center;font-style:normal;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.jk.e{background:rgba(255,255,255,.05);box-shadow:none;border:2px dashed var(--line);cursor:default}.jk.e:hover{transform:none}
.jd{font-size:12.5px;color:var(--mut);text-align:center;min-height:38px;margin:10px 4px 0;line-height:1.4}.jd b{color:var(--fg)}
.room .js{gap:6px;padding:8px 8px 9px;border-radius:14px;overflow-x:auto;scrollbar-width:none}
.room .js::-webkit-scrollbar{display:none}
.room .js .jk{min-width:52px;border-radius:8px}
.room .jk .em{font-size:20px;line-height:1}
.room .jk b{font-size:8.5px}
.room .jk i{font-size:8.5px;min-width:16px;max-width:90px}
.room .jd{min-height:0;margin:6px 4px 0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{min-height:34px;padding:8px 13px;margin:8px 0;font-size:13px}
/* top stats */
.top{display:flex;gap:8px;align-items:stretch;margin:6px 0}
.stat{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:3px 10px 4px;box-shadow:0 3px 0 var(--edge)}
.stat small{display:block;font-size:10px;color:var(--mut);line-height:1.3}.stat b{font-size:19px;line-height:1.1;font-weight:700}.stat em{font-style:normal;font-size:12px;color:var(--mut)}
.stat.gold b{color:var(--gold)}
.msg{background:rgba(0,0,0,.28);border-radius:14px;padding:8px 13px;font-size:13px;min-height:34px;margin:8px 0;border-left:4px solid var(--gold);line-height:1.45}
/* score panel */
.scorebar{display:grid;grid-template-columns:78px 1fr 88px;gap:8px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:10px 12px;box-shadow:0 5px 0 var(--edge);margin:14px 0}
.scorebar small{display:block;font-size:11px;color:var(--mut)}
.sw b{font-size:30px;color:var(--gold);line-height:1.1}
.calc{text-align:center}.hn{font-weight:600;font-size:14px;min-height:20px}
.mx{display:flex;align-items:center;justify-content:center;gap:6px;margin:5px 0 3px}.mx i{font-style:normal;font-weight:700}
.cb,.mb{font-weight:700;font-size:21px;padding:1px 10px;border-radius:10px;min-width:54px;color:#fff;text-align:center}
.cb{background:#3f5d70;box-shadow:0 3px 0 #1b2e3c}.mb{background:#e04a3a;box-shadow:0 3px 0 #8f241a}
#hs{font-size:12px;color:var(--mut);min-height:17px}#hs b{color:var(--fg);font-size:14px}
.cw{text-align:center}
.chip{--p:0%;width:64px;height:64px;border-radius:50%;background:conic-gradient(#4ade80 var(--p),rgba(255,255,255,.2) 0);display:grid;place-items:center;transition:--p .6s ease;margin:0 auto 2px}
.chip i{width:54px;height:54px;border-radius:50%;background:repeating-conic-gradient(#c0392b 0 15deg,#f5efdf 15deg 30deg);display:grid;place-items:center}
.chip b{width:36px;height:36px;border-radius:50%;background:#7a1c14;color:#fff;display:grid;place-items:center;font-size:12px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
/* table */
.table{position:relative;margin:14px 0;border-radius:30px;border:10px solid #24150e;background:radial-gradient(ellipse at 50% 28%,#5a121a,#2a080d 65%,#120406);padding:58px 2px 26px;box-shadow:inset 0 0 60px rgba(0,0,0,.75),0 0 0 2px #5d3a22,0 8px 0 #150b06,0 16px 24px rgba(0,0,0,.6)}
.dk{position:absolute;right:12px;top:10px;width:34px;height:48px;border-radius:6px;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;text-shadow:0 1px 2px #000;box-shadow:2px 2px 0 rgba(0,0,0,.4),4px 4px 0 rgba(0,0,0,.25)}
.cback{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.dk b{position:relative;z-index:1}
.hand{display:flex;justify-content:center;align-items:flex-end;--w:min(86px,calc((min(100vw,560px) - 64px)/6.2));min-height:calc(var(--w)*1.4 + 24px)}
/* cards */
.hc{flex:none;width:var(--w);margin-left:calc(var(--w)*-.26);cursor:pointer;-webkit-tap-highlight-color:transparent;perspective:700px;transform:translateY(calc(var(--d)*var(--d)*1.6px)) rotate(calc(var(--d)*3deg));transition:transform .3s cubic-bezier(.34,1.4,.5,1)}
.hc:first-child{margin-left:0}
.card{position:relative;width:100%;aspect-ratio:5/7;font-size:calc(var(--w)*.27);border-radius:calc(var(--w)*.12);color:#f3e7cd;user-select:none;
background:repeating-linear-gradient(45deg,rgba(201,161,74,.045) 0 2px,transparent 2px 4px),linear-gradient(150deg,#37291e 45%,var(--tint,#1a130f));
box-shadow:0 0 0 1px #000,inset 0 0 0 calc(var(--w)*.035) rgba(201,161,74,.3),inset 0 0 calc(var(--w)*.2) rgba(255,225,160,.08),0 2px 0 rgba(0,0,0,.5),0 8px 14px rgba(0,0,0,.6);
transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out,opacity .25s,box-shadow .2s;animation:sway 4.6s ease-in-out infinite;animation-delay:calc(var(--k,0)*-.7s)}
@keyframes sway{0%,100%{translate:0 0;rotate:-.7deg}50%{translate:0 -3px;rotate:.7deg}}
.card.r{color:#ff8580}
.ci{position:absolute;top:.3em;left:.38em;display:flex;flex-direction:column;align-items:center;line-height:1;font:700 1em Georgia,serif;font-style:normal}
.ci u{text-decoration:none;font-size:.85em}
.ci.bt{top:auto;left:auto;bottom:.3em;right:.38em;transform:rotate(180deg)}
.mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4em;opacity:.9;padding-left:.3em}
.bd{position:absolute;left:.25em;top:2.7em;font-size:.85em;font-style:normal}
.ug{--tint:#3a2a10;box-shadow:0 0 0 2px #c9a14a,0 8px 14px rgba(0,0,0,.6)}.um{--tint:#3a1212;box-shadow:0 0 0 2px #a32420,0 8px 14px rgba(0,0,0,.6)}.uc{--tint:#162733;box-shadow:0 0 0 2px #4d7186,0 8px 14px rgba(0,0,0,.6)}
@media (hover:hover){.hand .hc:hover{transform:translateY(-14px) rotate(calc(var(--d)*1.2deg));z-index:5}}
.hand .hc.sel{transform:translateY(-32px) rotate(0) scale(1.1);z-index:6}
.hc.sel .card{opacity:.8;box-shadow:0 0 0 3px var(--gold),0 14px 18px rgba(0,0,0,.5)}
.hand .hc.out{transform:translateY(-160px) scale(.8) rotate(0);opacity:0;z-index:8;transition:transform .5s cubic-bezier(.5,0,.8,.5),opacity .5s}
.hc.nw{animation:deal .55s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:calc(var(--k)*60ms)}
@keyframes deal{from{opacity:0;transform:translate(150px,-70px) rotate(28deg) scale(.5)}}
.grid{display:flex;flex-wrap:wrap;gap:14px 10px;--w:46px}.grid .hc{margin:0;transform:none!important}
/* buttons */
button{--btn:#493224;--btn-d:#22140d;font:600 16px Cinzel,Georgia,serif;border:1px solid #6b4a31;border-radius:11px;padding:14px 16px;color:#f0e3c8;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent),var(--btn);box-shadow:0 5px 0 var(--btn-d),0 9px 14px rgba(0,0,0,.45);cursor:pointer;flex:1;text-shadow:0 1px 0 rgba(0,0,0,.5);letter-spacing:.3px;transition:transform .08s,box-shadow .08s,filter .15s}
button:hover{filter:brightness(1.1)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-d),0 2px 6px rgba(0,0,0,.35)}
button.alt{--btn:#2e241c;--btn-d:#130d09}button.red{--btn:#8e2420;--btn-d:#450d0b}button.blue{--btn:#2f4a5c;--btn-d:#152734}button.gold{--btn:#b8892f;--btn-d:#674510;color:#1b1206;text-shadow:none}
button:disabled{opacity:.45;filter:grayscale(.5);cursor:not-allowed;transform:none}
button.ico{flex:none;min-width:44px;padding:0 8px;font-size:15px;--btn:#2e241c;--btn-d:#130d09;box-shadow:0 4px 0 var(--btn-d)}
button.sm{flex:none;padding:7px 12px;font-size:12px;border-radius:12px}
.row{display:flex;gap:12px;margin:14px 0}
/* panels */
.box{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px;margin:16px 0;box-shadow:0 5px 0 var(--edge)}
.box h3{margin:0 0 8px;font:700 18px Cinzel,Georgia,serif;letter-spacing:.3px}.box p{margin:0 0 14px;font-size:13.5px;line-height:1.55;color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin:4px 2px 12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{--btn:var(--panel);--btn-d:var(--edge);display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;min-height:130px;text-align:left;border:2px solid var(--line);font-weight:500;color:var(--fg);text-shadow:none}
.tile .ic{font-size:30px}.tile b{font-size:16px;font-weight:600}
.tile small{font-size:12px;color:#2a1c00;background:var(--gold);padding:1px 9px;border-radius:10px;font-weight:600;margin-top:auto}
/* reel */
.reel{position:relative;overflow:hidden;border-radius:18px;background:rgba(0,0,0,.35);padding:14px 0;margin:12px 0;border:2px solid var(--line)}
.reel:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.6),transparent 18%,transparent 82%,rgba(0,0,0,.6));pointer-events:none}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gold);z-index:2;box-shadow:0 0 12px var(--gold)}
.trk{display:flex;will-change:transform}
.ri{flex:none;width:84px;height:84px;margin-right:10px;border-radius:16px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.16);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px}
.ri small{font-size:11px;opacity:.7}
.ri.hit{box-shadow:0 0 0 3px var(--gold),0 0 26px var(--gold);transform:scale(1.07);transition:.3s}
.odds{font-size:12.5px;color:var(--mut);text-align:center;margin:12px 0}
.step{display:flex;align-items:center;justify-content:center;gap:14px}.step button{flex:none;width:54px;padding:10px;font-size:22px}.step b{font-size:30px;min-width:70px;text-align:center}
details{font-size:13px;margin:16px 2px;color:var(--mut)}td{padding:2px 10px 2px 0}
.suit{margin:10px 0 6px;font-weight:700}
/* home + collection */
.hero{text-align:center;padding:26px 0 10px}.hero p{color:var(--mut);margin:12px 0 0;font-size:14px}
.fan{display:flex;justify-content:center;--w:66px;margin:0 0 24px;height:120px;align-items:flex-end}
.logo{font:900 46px/1 Cinzel,Georgia,serif;color:#e2d3b2;letter-spacing:2px;text-shadow:0 3px 0 #7a5208,0 0 20px rgba(201,161,74,.4),0 12px 16px rgba(0,0,0,.6)}
.goal{display:inline-block;margin-top:14px;background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:6px 16px;font-size:13px;box-shadow:0 3px 0 var(--edge)}
.menu{display:flex;flex-direction:column;gap:10px;margin:14px 0}.menu button{font-size:18px;padding:12px 14px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jc{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 var(--edge)}
.jc .em{font-size:26px}.jc b{font-size:14px}.jc small{color:var(--mut);font-size:11.5px;line-height:1.45}
.jc.bl{border-color:#2fbf6a}.jc.cu{border-color:#e0443a}.jc.lk{opacity:.6}.jc.lk .em{filter:grayscale(1)}
/* effects */
.bn{position:fixed;left:50%;top:34%;z-index:60;pointer-events:none;font:700 32px Fredoka,sans-serif;padding:12px 26px;background:var(--gold);color:#2a1c00;border-radius:18px;box-shadow:0 6px 0 #a87400,0 16px 30px rgba(0,0,0,.5);animation:bn 1.7s ease both;white-space:nowrap}
.bn.x{background:#e0443a;color:#fff;box-shadow:0 6px 0 #8f1d1d,0 16px 30px rgba(0,0,0,.5)}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}30%,80%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-70%) scale(1.05)}}
.pop{position:fixed;z-index:55;pointer-events:none;font:700 30px Fredoka,sans-serif;color:var(--gold);text-shadow:0 2px 0 #000,0 0 12px rgba(255,210,74,.6);animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.pt{position:fixed;z-index:55;pointer-events:none;font-size:22px;animation:pt 1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rt));opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,2px)}}
.hc.ns .card{filter:grayscale(.7) brightness(.75)}
.hc.db .card{filter:grayscale(1) brightness(.55)}
.boss{background:linear-gradient(90deg,#7a1c14,#a32a1f);color:#fff;border-radius:14px;padding:9px 13px;font-size:13px;line-height:1.45;margin:12px 0;box-shadow:0 4px 0 #3a0c08}
.cons{display:flex;gap:8px;margin:12px 0}
.cn{flex:1;min-height:62px;padding:8px;font-size:12px;border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;--btn:#6b3fa0;--btn-d:#3d2260;line-height:1.25;font-weight:600}
.cn small{font-size:10.5px;font-weight:400;opacity:.9}
div.cn.e{background:rgba(255,255,255,.05);border:2px dashed var(--line);box-shadow:none;color:var(--mut);align-items:center;justify-content:center;font-weight:400}
.tile .ds{font-size:12.5px;color:var(--mut);font-weight:400}
.pgw.in{animation:pgin .4s cubic-bezier(.2,.8,.3,1)}
@keyframes pgin{from{opacity:0;transform:translateY(14px)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes bob{50%{transform:translateY(-6px)}}
.map{display:flex;justify-content:space-between;align-items:center;position:relative;margin:14px 2px 10px}
.map:before{content:"";position:absolute;left:10px;right:10px;top:50%;height:3px;margin-top:-1.5px;background:var(--line)}
.nd{position:relative;width:20px;height:20px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:10px;display:grid;place-items:center;font-weight:600}
.nd.bs{border-color:#e0443a;width:25px;height:25px;font-size:12px}
.nd.dn{background:#2fbf6a;border-color:#2fbf6a;color:#06301a}
.nd.cur{background:var(--gold);border-color:#fff;color:#2a1c00;animation:pulse 1.4s ease-in-out infinite}
.vs{display:flex;align-items:center;justify-content:center;gap:18px;margin:20px 0 8px}
.who{font-size:58px;line-height:1;text-align:center;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.who small{display:block;font-size:12px;color:var(--fg);margin-top:8px;font-weight:600}
.vsx{font:700 28px Fredoka,sans-serif;color:var(--gold);text-shadow:0 3px 0 #7a5208;animation:pulse 1.6s ease-in-out infinite}
.foe{animation:bob 2.4s ease-in-out infinite}
.bub{position:relative;background:#1b1410;color:#eadfc8;border:1px solid #42301f;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.4;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.bub.big{text-align:center;margin:10px 4px 16px;font-style:italic}
.goalrow{display:flex;align-items:center;gap:14px;justify-content:center;margin:8px 0 14px}.goalrow .chip{margin:0}
.npc{display:flex;align-items:center;gap:14px;margin:10px 0 14px}
.av{font-size:48px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35));animation:bob 3s ease-in-out infinite}
.npc .bub{flex:1}.npc .bub:before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#1b1410;border-left:0}
.salon{background:linear-gradient(90deg,#14684a,#1c8a61);color:#fff;border-radius:14px;padding:9px 13px;font-size:13px;line-height:1.45;margin:12px 0;box-shadow:0 4px 0 #0a3a29}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:80;background:var(--gold);color:#2a1c00;font-weight:600;padding:8px 16px;border-radius:99px;box-shadow:0 4px 0 #a87400,0 10px 20px rgba(0,0,0,.4);animation:tst 3.3s ease both;white-space:nowrap;pointer-events:none}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-30px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
.it{display:flex;gap:12px;align-items:center;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:14px;margin:8px 0;border:2px solid transparent}
.it.bl{border-color:#2fbf6a}.it.cu{border-color:#e0443a}.it>span{font-size:26px}.it small{color:var(--mut)}
.ov{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(560px,100%);max-height:88vh;background:var(--panel);color:var(--fg);border:2px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:up .32s cubic-bezier(.2,.9,.3,1)}

.sb{overflow:auto;flex:1;padding:2px}.sb h3{margin:12px 0 2px;font:700 15px Fredoka,sans-serif}.sb button{width:100%;margin:6px 0}
.tabs{display:flex;gap:6px}.tabs button{padding:9px 2px;font-size:12.5px;--btn:#2e241c;--btn-d:#130d09;box-shadow:0 3px 0 var(--btn-d)}.tabs button.on{--btn:#3f5d70;--btn-d:#1b2e3c}

.lobby:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 0 7%,rgba(0,0,0,.62) 7% 10%,transparent 10% 90%,rgba(0,0,0,.62) 90% 93%,transparent 93%),radial-gradient(circle at 13% 24%,rgba(255,150,50,.22),transparent 11%),radial-gradient(circle at 87% 24%,rgba(255,150,50,.22),transparent 11%)}
.spot{position:absolute;left:50%;top:-30%;width:150%;height:120%;margin-left:-75%;background:conic-gradient(from 160deg at 50% 0,transparent 0 8%,rgba(201,161,74,.16) 13%,transparent 21% 29%,rgba(122,28,20,.16) 34%,transparent 42%);animation:sweep 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes sweep{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.sp{position:absolute;bottom:-34px;color:#c9a14a;opacity:.28;animation:rise linear infinite;pointer-events:none}.sp.r{color:#7a1c14}
@keyframes rise{to{transform:translateY(-460px) rotate(50deg);opacity:0}}
.lobby .fan{position:relative;margin:0 0 18px}
.neon{position:relative;font:900 clamp(40px,12.5vw,60px)/.92 Cinzel,Georgia,serif;color:#e2d3b2;letter-spacing:4px;text-shadow:0 2px 0 #000,0 0 12px rgba(201,161,74,.5),0 0 38px rgba(122,28,20,.45);animation:flick 7s infinite}
.neon span{color:#c9a14a;text-shadow:0 2px 0 #000,0 0 12px rgba(201,161,74,.65),0 0 34px rgba(122,28,20,.5)}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
.tag{position:relative;margin-top:14px;font:600 12px Cinzel,Georgia,serif;letter-spacing:.8px;color:var(--mut)}
.menu button small{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:2px}
.two{display:flex;gap:12px}
.stats{display:flex;gap:8px;margin:12px -12px 4px;padding:4px 12px 10px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.stats::-webkit-scrollbar{height:5px}.stats::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.stats div{flex:0 0 auto;min-width:88px;scroll-snap-align:start;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;box-shadow:0 3px 0 var(--edge)}
.stats b{display:block;font-size:20px;color:var(--gold);line-height:1.1}.stats small{font-size:10.5px;color:var(--mut)}
.sec{margin:18px 2px 8px;font:600 13px Fredoka,sans-serif;color:var(--mut);letter-spacing:.6px}
.mk{display:flex;gap:16px;justify-content:center;margin:14px 0}.mi{text-align:center;--w:72px}.mi small{display:block;color:var(--mut);margin-top:8px}
.tarot{perspective:900px;display:flex;justify-content:center;margin:14px 0 20px}
.tcard{position:relative;width:156px;height:240px;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.3,1.3,.5,1);animation:tfloat 3s ease-in-out infinite}
.tcard.flip{transform:rotateY(180deg);animation:none}
@keyframes tfloat{50%{translate:0 -8px}}
.tback,.tfront{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center}
.tback{background:repeating-conic-gradient(from 0deg at 50% 50%,#3a1c63 0 10deg,#4f2a85 10deg 20deg);border:4px solid #e6c36a;font-size:64px;box-shadow:0 8px 0 rgba(0,0,0,.35),inset 0 0 30px rgba(0,0,0,.5)}
.tfront{transform:rotateY(180deg);background:linear-gradient(160deg,#fff7e0,#e8d6a6);color:#2a1c00;border:4px solid #7a4cc2;box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 30px rgba(122,76,194,.6)}
.tbig{font-size:58px;line-height:1}.tfront b{font-size:16px}.tfront small{font-size:11.5px;line-height:1.3;color:#4a3a1a}
.msg .grid{gap:8px}
.cf{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.8))}
.card .bd{position:absolute;left:3%;top:30%;width:27%;height:auto;font-size:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.hc.db:after{content:"";position:absolute;inset:0;border:3px solid #e0443a;border-radius:calc(var(--w)*.12);background:linear-gradient(to top right,transparent 46%,#e0443a 47%,#e0443a 53%,transparent 54%);pointer-events:none;z-index:3}
.nope{animation:nope .35s}@keyframes nope{25%{transform:translateX(-5px);color:#ff8a80}75%{transform:translateX(5px);color:#ff8a80}}
.clr{position:absolute;left:12px;top:10px;z-index:7;flex:none;width:auto;padding:5px 12px;font-size:12px;border-radius:99px;--btn:#2e241c;--btn-d:#130d09;box-shadow:0 3px 0 var(--btn-d)}
.mt{position:absolute;top:10px;right:10px;z-index:3}
.pp{color:var(--gold);letter-spacing:2px}
.sg{display:block;width:100%;height:auto}.jk .sg{width:64%;margin-top:2px}.jc .sg{width:46px;height:46px}.it>span .sg{width:38px;height:38px}
.por{display:block;width:100%;height:100%}
.pv2{width:104px;height:104px;border-radius:24px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.35);margin:0 auto}
.who em{display:block;font-size:11px;color:var(--mut);font-style:normal;margin-top:2px}
.tr{font-style:normal;font-size:12px;color:#6b5a3a}
.av{width:60px;height:60px;border-radius:16px;overflow:hidden;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.35);font-size:0}
.dealer{display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:8px 10px;margin:12px 0;box-shadow:0 4px 0 var(--edge)}
.dp{width:56px;height:56px;flex:none;border-radius:14px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.di{flex:none;max-width:42%;line-height:1.2}.di b{font-size:14px}.di small{display:block;color:var(--mut);font-size:10.5px}
.dc{display:flex;gap:8px;margin-top:5px}.dg{display:flex;padding-left:7px}
.cb2{position:relative;display:block;width:15px;height:21px;margin-left:-7px;border-radius:3px;overflow:hidden}
.say{flex:1;position:relative;font-size:11.5px;line-height:1.3;background:#1b1410;color:#d8cbb0;border:1px solid #42301f;border-radius:12px;padding:7px 10px;font-style:italic}
.say:before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:#1b1410;border-left:0}
.ov.midc{align-items:center}.ov.midc .sheet{border-radius:24px;border-bottom:2px solid var(--line);margin:0 12px;align-items:center;text-align:center}
.sdbox{--w:44px}
.sdt{display:flex;gap:12px;align-items:center;justify-content:center}.sdt .dp{width:50px;height:50px}
.sdcards{display:flex;flex-direction:column;gap:12px;margin:6px 0;align-items:center}.sdh small{display:block;margin-top:6px;color:var(--mut)}.sdh small b{color:var(--gold)}
.sdc{display:flex;gap:6px;justify-content:center}
.fl{position:relative;width:var(--w);aspect-ratio:5/7;perspective:600px}
.fl>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .7s ease;transition-delay:calc(var(--k)*140ms)}
.fb{border-radius:6px;overflow:hidden}
.ff{transform:rotateY(180deg)}.ff .hc{margin:0;width:100%;transform:none}
.fl.up .fb{transform:rotateY(-180deg)}.fl.up .ff{transform:rotateY(0)}
.sdtot{font:700 20px Fredoka,sans-serif}.sdtot b{color:var(--gold)}.sdtot b.win{color:var(--win)}.sdtot b.lose{color:var(--bad)}
/* ---- v9: table scene, gun, showdown, effects ---- */
body.room{background:#140c08}
body.room:before{background:radial-gradient(55% 38% at 50% 0,rgba(255,214,140,.3),transparent 72%),radial-gradient(80% 60% at 50% 105%,rgba(0,0,0,.6),transparent);animation:none}
body.dead{background:#000}body.dead:before{display:none}
.gunbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 0}
.life{width:78px;text-align:center}.life small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--mut)}
.life b{font-size:19px;color:#ff5c6c;letter-spacing:2px;text-shadow:0 0 10px rgba(255,92,108,.55)}
.gunw{flex:1;display:flex;justify-content:center;align-items:center;height:54px}
.gunw .gun{width:102px;animation:gspin 8s linear infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
@keyframes gspin{to{transform:rotate(360deg)}}
.seat{display:flex;gap:10px;align-items:center;margin:2px 4px 0;position:relative;z-index:2}
.seat .dp{width:62px;height:62px;border-radius:16px}
.seat.enter{animation:seatin .75s cubic-bezier(.2,.9,.3,1)}
@keyframes seatin{from{opacity:0;transform:translateY(-70px)}}
.dp.nod{animation:nod .5s ease}@keyframes nod{30%{transform:translateY(4px) rotate(-4deg)}60%{transform:translateY(-3px) rotate(3deg)}}
.say.pop{animation:sayp .45s ease}@keyframes sayp{from{transform:scale(.85);opacity:.3}}
.table{position:relative;margin:-4px 0 8px;padding:14px 4px 14px;border:0;background:none;box-shadow:none;border-radius:0;overflow:visible}
.stage{position:relative;margin:2px 0 0;padding:0 0 6px;min-height:118px}
.stage .seat{position:absolute;left:4px;right:4px;top:6px;margin:0;z-index:2}
.chair{position:absolute;left:50%;top:-16px;width:190px;height:142px;margin-left:-95px;z-index:0;opacity:.7;filter:drop-shadow(0 10px 16px rgba(0,0,0,.7));pointer-events:none}
.chair svg{width:100%;height:100%;display:block}
.dealerrim{position:absolute;left:6%;right:6%;top:96px;height:34px;border-radius:50% 50% 40% 40%;background:linear-gradient(180deg,#3b1c12,#150a07 70%);border:2px solid #6a4429;box-shadow:inset 0 6px 14px rgba(0,0,0,.7),0 6px 14px rgba(0,0,0,.6);z-index:0;pointer-events:none}
.actbar{position:sticky;bottom:0;z-index:8;margin:6px -12px -12px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 78%,rgba(13,11,10,.9) 55%,transparent)}
.actbar .row{margin:0 0 6px}.actbar button{padding:11px 12px;font-size:15px}
.actbar .cons{margin:6px 0 0}.actbar .hint{margin:2px 0 4px}
.minirow{display:flex;gap:8px;align-items:stretch}
.minirow button{flex:1;padding:8px 10px;font-size:12.5px;line-height:1.25;text-shadow:none}
.minirow button small{font-size:10.5px}
.minirow .hint{flex:1;align-self:center;margin:0;text-align:center;font-size:12px}
.felt{position:absolute;inset:0;border-radius:44px 44px 30px 30px;border:10px solid #24150e;background:radial-gradient(ellipse at 50% 18%,#5a121a,#2a080d 62%,#120406);box-shadow:inset 0 0 60px rgba(0,0,0,.75),0 0 0 2px #5d3a22,0 8px 0 #150b06,0 18px 26px rgba(0,0,0,.6);transform:perspective(800px) rotateX(13deg);transform-origin:50% 100%}
.table>*:not(.felt){position:relative;z-index:1}
.table>.clr{position:absolute;z-index:7}.table>.dk{position:absolute;z-index:2;top:20px;right:18px}
.dhand{display:flex;justify-content:center;min-height:36px;padding:2px 0 0;position:relative;z-index:1;filter:drop-shadow(0 6px 5px rgba(0,0,0,.65))}
.dhand .dc{margin:0;gap:18px}.dhand .cb2{width:25px;height:36px;margin-left:-13px;border-radius:4px}
.mv .cb2{animation:dmv .7s ease both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes dmv{30%{transform:translateY(-9px) rotate(-9deg)}60%{transform:translate(7px,-4px) rotate(7deg)}}
.pot{display:grid;grid-template-columns:78px 1fr 84px;gap:8px;align-items:center;margin:0 10px 2px;color:#fff}
.pot small{display:block;font-size:10.5px;opacity:.75}.pot .sw b{font-size:28px;color:var(--gold);line-height:1.1}
.pot .hn{font-weight:600;font-size:13px;min-height:19px;text-align:center}.pot .calc{text-align:center}
.pot #hs{font-size:12px;opacity:.85;min-height:16px}.pot #hs b{color:#fff;font-size:14px}
.chip.q{background:rgba(255,255,255,.2)}.chip.q i{background:repeating-conic-gradient(#3a3a3a 0 15deg,#f5efdf 15deg 30deg)}.chip.q b{background:#222;font-size:22px}
.table .cw{text-align:center}.table .chip{width:58px;height:58px}.table .chip i{width:48px;height:48px}.table .chip b{width:32px;height:32px}
.row.top{margin:4px 0 12px}button small{display:block;font-size:11px;font-weight:400;opacity:.85}button.wide{width:100%;flex:none;margin:2px 0 6px;padding:10px}
.jk.cr{border-color:#a855f7;box-shadow:0 0 14px -4px #a855f7}.jc.cr{border-color:#a855f7}.it.cr{border-color:#a855f7}
.jk i{width:auto;min-width:19px;height:auto;padding:1px 5px;border-radius:99px;font-size:9px;line-height:1.6;white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis;right:-5px}
.over{text-align:center;padding:70px 10px;color:#eadfc8}.over h2{font:900 44px Cinzel,Georgia,serif;color:#d8554c;margin:0 0 6px;text-shadow:0 0 24px rgba(216,85,76,.45),0 3px 0 #000}.over p{color:var(--mut);margin:0 0 24px}
#cur{position:fixed;inset:0;z-index:95;background:#000;opacity:0;pointer-events:none;transition:opacity .42s ease}#cur.on{opacity:1;pointer-events:auto}
.ov.out{opacity:0;transition:opacity var(--fo,.6s) ease}
.sdbox{position:relative}.sk{position:absolute;top:10px;right:12px;flex:none;width:auto;padding:4px 12px;font-size:11px;border-radius:99px;--btn:#2e241c;--btn-d:#130d09;box-shadow:0 3px 0 var(--btn-d)}
.sdtot{opacity:0;transition:opacity .5s}.sdtot.show{opacity:1}
.sdgw{position:relative;width:100%;height:150px;margin:2px 0}.sdgw small{position:absolute;left:0;right:0;font-size:10px;letter-spacing:2px;color:var(--mut)}.sdgw small:first-child{top:0}.sdgw small:last-child{bottom:0}
.sdg{position:absolute;left:50%;top:50%;width:130px;margin:-18px 0 0 -65px;transform:rotate(0)}.sdg .gun{width:100%;display:block;filter:drop-shadow(0 5px 5px rgba(0,0,0,.5))}
.sdg.spin{animation:gspin2 1.9s cubic-bezier(.1,.75,.2,1) forwards}.sdg.set{transform:rotate(var(--end))}
@keyframes gspin2{from{transform:rotate(0)}to{transform:rotate(calc(var(--end) + 1080deg))}}
.sdv{font:700 30px Fredoka,sans-serif;opacity:0;transform:scale(.6);transition:all .35s cubic-bezier(.3,1.6,.5,1)}.sdv.show{opacity:1;transform:none}.sdv.win{color:var(--win)}.sdv.lose{color:var(--bad)}
#sdq{opacity:0;transition:opacity .4s}#sdq.show{opacity:1}
#sdb{visibility:hidden;opacity:0;transition:opacity .4s}#sdb.show{visibility:visible;opacity:1}
.ko{position:absolute;inset:0;display:grid;place-items:center;font:700 16px Fredoka,sans-serif;font-style:normal;color:#fff;background:rgba(0,0,0,.55);opacity:0;letter-spacing:1px}
.dp{position:relative}.dp.hit{animation:hit .7s forwards}.dp.hit .ko{opacity:1}
@keyframes hit{15%{transform:translateX(-6px) rotate(-6deg)}30%{transform:translateX(6px) rotate(6deg)}100%{transform:translateY(8px) rotate(14deg);filter:grayscale(1) brightness(.6)}}
.sheet.kick{animation:kick .45s}@keyframes kick{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-3px,-1px)}}
.lt{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;background:#fff;transition:background 1.6s ease}
.lt.muz{background:radial-gradient(circle at 50% 38%,#fff9d0,#ffa63a 35%,rgba(255,120,20,0) 70%);animation:muz .55s ease-out forwards}
@keyframes muz{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.lt.flood{animation:flood 1.4s ease forwards}@keyframes flood{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.lt.floodf{animation:floodf .55s ease forwards}@keyframes floodf{to{opacity:1}}
.lt.dark{background:#000}
/* ---- v10 additions ---- */
.sdv.near{color:#ffd24a;text-shadow:0 0 22px rgba(255,210,74,.75)}
.sheet.near .sdtot b{color:#ffd24a}
.lt.near{background:radial-gradient(circle at 50% 45%,rgba(255,240,170,.9),rgba(255,170,40,.35) 45%,transparent 75%);animation:muz .85s ease-out forwards}
.sdbox.near .sdv{font-size:27px}
/* ---- v10.4: showdown table scene + wager chips ---- */
.sdstage{flex:none;position:relative;overflow:hidden;border-radius:18px 18px 12px 12px;margin:-2px 0 6px;padding:74px 0 4px;background:radial-gradient(ellipse at 50% -12%,rgba(255,214,140,.22),transparent 58%),radial-gradient(ellipse at 50% 120%,#0a2019,#071410);border:2px solid #3b2417;box-shadow:inset 0 0 34px rgba(0,0,0,.7)}
.sdstage:before{content:"";position:absolute;left:-10%;right:-10%;top:-46%;height:96%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,214,140,.13),transparent 70%);pointer-events:none}
.sil{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:132px;height:96px;opacity:.92;pointer-events:none;filter:drop-shadow(0 -3px 12px rgba(255,190,110,.32))}
.sil svg{width:100%;height:100%;display:block}
.sil.dim{opacity:.55;filter:none}
.sdrail{position:relative;padding:0 6px}
.sdfelt{position:relative;margin:0 4px;padding:10px 6px 8px;border-radius:26px;background:radial-gradient(ellipse at 50% 12%,#5a121a,#2a080d 62%,#120406);border:6px solid #24150e;box-shadow:inset 0 0 40px rgba(0,0,0,.75),0 4px 0 #150b06}
.sdpot{display:flex;justify-content:center;align-items:flex-end;gap:3px;height:30px;margin:1px 0 5px}
.sdpot i{width:19px;height:19px;border-radius:50%;background:repeating-conic-gradient(#c0392b 0 15deg,#f5efdf 15deg 30deg);border:2px solid #7a1c14;box-shadow:0 2px 0 rgba(0,0,0,.5);opacity:0;transform:translateY(16px) scale(.5)}
.sdpot i.in{animation:potin .45s cubic-bezier(.2,1.5,.4,1) forwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes potin{to{opacity:1;transform:none}}
.sdstage .sdcards{gap:8px;margin:2px 0}
.sdstage .sdh small{color:#d9f3e9}
.sdstage .sdtot{font-size:17px}
/* wager chips that slide forward when you play */
.wager{position:absolute;left:50%;bottom:var(--wager-bottom,140px);transform:translateX(-50%);display:flex;gap:3px;pointer-events:none;z-index:5}
.wager i{width:20px;height:20px;border-radius:50%;background:repeating-conic-gradient(#c0392b 0 15deg,#f5efdf 15deg 30deg);border:2px solid #7a1c14;box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.25)}
.wager i:nth-child(2){background:repeating-conic-gradient(#1e5fa8 0 15deg,#f5efdf 15deg 30deg);border-color:#123a6b}
.wager i:nth-child(3){background:repeating-conic-gradient(#2e9e5b 0 15deg,#f5efdf 15deg 30deg);border-color:#14532e}
.wager.push i{animation:wagerpush .62s cubic-bezier(.5,-.2,.4,1.2) forwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes wagerpush{0%{transform:translateY(0) scale(1)}70%{transform:translateY(-var(--push,86px)) scale(1.08)}100%{transform:translateY(calc(var(--push,86px) * -1)) scale(.35);opacity:.15}}
.hint{font-size:11px;color:var(--gold);text-align:center;margin:4px 0 8px}
.dv{background:linear-gradient(90deg,#5a1230,#8f1d4a);color:#fff;border-radius:14px;padding:9px 13px;font-size:13px;line-height:1.45;margin:12px 0;box-shadow:0 4px 0 #35081c}
.dv b{color:#ffd24a}
/* ---- v10.1: contained scrolling (no more endless pages) ---- */
.scrl{max-height:calc(100vh - 158px);max-height:calc(100dvh - 158px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding-right:6px;margin-right:-6px}
.scrl::-webkit-scrollbar{width:6px}
.scrl::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.scrl::-webkit-scrollbar-thumb:hover{background:var(--gold)}
.scrl::-webkit-scrollbar-track{background:rgba(0,0,0,.12);border-radius:99px}
.scrl .box:first-child{margin-top:4px}
.scrl .box:last-child,.scrl .row:last-child{margin-bottom:4px}

kbd{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:5px;padding:0 5px;font:600 11px Fredoka,sans-serif;color:var(--gold)}

.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 14px}

.dcard{--dc:#888;position:relative;min-height:126px;border-radius:16px;border:2px solid rgba(255,255,255,.28);background:linear-gradient(155deg,var(--dc),rgba(0,0,0,.42));color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:10px 5px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .16s,box-shadow .16s;overflow:hidden}

.dcard:hover{transform:translateY(-3px)}
.dcard.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,74,.55),0 5px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);transform:translateY(-3px)}
.dcard.on:after{content:"✓";position:absolute;top:5px;right:7px;font:700 15px Fredoka,sans-serif;color:var(--gold)}
.dinfo{background:linear-gradient(130deg,var(--dc),rgba(0,0,0,.35));border:2px solid var(--gold);border-radius:18px;padding:13px 14px;margin:6px 0 14px;box-shadow:0 4px 0 rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;min-height:78px}
.dinfo .em{font-size:36px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.dinfo b{font-size:17px}.dinfo p{margin:3px 0 0;font-size:13px;line-height:1.4;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.dinfo.empty{--dc:#2e241c;border-color:var(--line);justify-content:center;text-align:center}
.dinfo.empty b{color:var(--mut);font-size:14px;font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- v10: seeded RNG (daily run + shareable seed) ---- */
let RNG=null;
function mkRng(n){return{s:n|0,f:function(){this.s=this.s+0x6D2B79F5|0;let t=Math.imul(this.s^this.s>>>15,1|this.s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}}
function seedRun(n){RNG=mkRng(n);return RNG}
const rnd=()=>RNG?RNG.f():Math.random();
const todaySeed=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
const seedTag=s=>'HP-'+String(s).slice(2);

const JK=[
{n:'Set Master',e:'🎩',b:1,perm:1,d:'Three of a Kind: permanent +1 mult on every hand',k:0,sc:(j,x)=>{x.mu+=j.k},pl:(j,x)=>{if(x.t==3){j.k++;return`Set Master grows: permanent +${j.k} mult`}}},

{n:'Opening Gambit',e:'⚡',b:1,d:'First hand of the round: mult ×2',sc:(j,x)=>{if(x.first)x.mx*=2}},

{n:'Full House Chef',e:'🍲',b:1,perm:1,d:'Full House: permanent +1 mult',k:0,sc:(j,x)=>{x.mu+=j.k},pl:(j,x)=>{if(x.t==6||x.t==10){j.k++;return`Full House Chef: permanent +${j.k} mult`}}},

{n:'Rusting Crown',e:'🥀',b:2,d:'Starts at +8 mult but loses 1 mult with every hand you play (down to −4)',k:8,sc:(j,x)=>{x.mu+=j.k},pl:j=>{j.k=Math.max(-4,j.k-1);return`Rusting Crown rusts: ${j.k>=0?'+':''}${j.k} mult`},st:j=>`${j.k>=0?'+':''}${j.k} mult`},
{n:'Sour Milk',e:'🥛',b:2,d:'Starts at +60 chips but loses 10 chips every round (down to −50)',k:60,sc:(j,x)=>{x.ch+=j.k},rw:j=>{j.k=Math.max(-50,j.k-10);return j.k<0?'Sour Milk has gone off!':''},st:j=>`${j.k>=0?'+':''}${j.k} chips`},

{n:'Fickle Fate',e:'🌓',b:2,d:'Flips every round: +4 mult, then −2 mult, then +4 again',m:1,sc:(j,x)=>{x.mu+=j.m?4:-2},rw:j=>{j.m=j.m?0:1;return`Fickle Fate flips to ${j.m?'+4':'−2'} mult`},st:j=>j.m?'+4 mult':'−2 mult'},
{n:'Glass Heart',e:'💎',b:2,d:'+6 mult, but each scored ♥ adds a crack. At 6 cracks it shatters into −4 mult',k:0,m:0,sc:(j,x)=>{x.mu+=j.m?-4:6},pl:(j,x)=>{if(j.m)return;const n=x.cs.filter(c=>c.s==1).length;if(n){j.k+=n;if(j.k>=6){j.m=1;return'Glass Heart shatters! Now −4 mult'}return`Glass Heart cracks (${j.k}/6)`}},st:j=>j.m?'SHATTERED':`${j.k}/6 cracks`},

const offerCard=o=>`<button class="offer" onclick="offer('${o.id}')" ${o.ok?'':'disabled'}><span class="ic">${o.ic}</span><b>${o.t}</b><small>${o.s}</small><span class="go">${o.ok?'Tap to open · yana kaydır':'Not available now'}</span></button>`;
function shopPool(){
 const o=[];
 if(G.gold>=cCost())o.push({id:'up',ic:'🛠',t:'Upgrade a card',s:cCost()+' gold',ok:true});
 if(G.gold>=rmC()&&deck.length>20)o.push({id:'rm',ic:'🗑',t:'Remove a card',s:rmC()+' gold',ok:true});
 if(G.gold>=MKP&&(G.mk||[]).length)o.push({id:'mk',ic:'🛒',t:'Card market',s:MKP+' gold each',ok:true});
 if(G.gold>=lvC())o.push({id:'lv',ic:'📈',t:'Random level-up',s:lvC()+' gold',ok:true});
 if(G.gold>=lvS())o.push({id:'lv2',ic:'🎯',t:'Choose level-up',s:lvS()+' gold',ok:true});
 if(G.gold>=3&&G.cons.length<G.cslots)o.push({id:'tr',ic:'🔮',t:'Draw tarot',s:'3 gold',ok:true});
 if(G.gold>=1&&(G.spins||0)<1)o.push({id:'box',ic:'🎲',t:'Mystery box',s:'from 1 gold · 1 spin/visit',ok:true});
 if(G.gold>=4&&G.cons.length<G.cslots)o.push({id:'pack',ic:'🎴',t:'Consumable pack',s:'4 gold',ok:true});
 if(sellable().length)o.push({id:'sell',ic:'💰',t:'Sell a joker',s:'last 3 rounds only · mortal jokers',ok:true,keep:1});
 if(G.gold>=jMin()&&G.jk.length<G.slots)o.push({id:'jok',ic:'🃏',t:'Joker',s:'up to '+jMax()+' gold (min '+jMin()+')',ok:true});
 if(G.vo&&G.gold>=G.vo.p)o.push({id:'vc',ic:G.vo.e,t:G.vo.n,s:G.vo.p+' gold',ok:true,keep:1});
 if(G.rj&&G.gold>=RARE_PRICE&&G.jk.length<G.slots)o.push({id:'rj',ic:'🌟',t:'ULTRA RARE: '+G.rj.n,s:RARE_PRICE+' gold · '+G.rj.e,ok:true,keep:1});
 if(G.gold>=7&&G.bribe>=1)o.push({id:'br',ic:'💸',t:'Bribe the dealer',s:'7 gold',ok:true});
 if(G.dev)o.push({id:'dev',ic:G.dev.e,t:"Devil's deal: "+G.dev.n,s:'no gold · see the cost',ok:true,keep:1});
 return o;
}
const dealOffers=()=>{const all=shopPool(),keep=all.filter(o=>o.keep).map(o=>o.id),rest=shuf(all.filter(o=>!o.keep)).map(o=>o.id);return keep.concat(rest).slice(0,6)};
function offer(id){
 const o=shopPool().find(x=>x.id==id);if(!o||!o.ok)return;
 const lbl=document.getElementById('shopOffersPos'),m=lbl&&lbl.textContent.match(/\d+/);G.offerIx=m?Math.max(0,+m[0]-1):0;
 G.cur=id;if(id=='pack')G.pk=genPack();if(id=='box')G.bet=Math.min(2,G.gold);
 V=({up:'cust',rm:'rm',mk:'mk',lv:'lvl',lv2:'lv2',tr:'tr',box:'box',pack:'cn',jok:'jok',sell:'sell',vc:'vc',rj:'rare',br:'br',dev:'dev'})[id]||'menu';snd(520,.05);render();
}
function rerollShop(){
 if(G.rerolls<1||G.gold<2||G.act<1)return;
 G.gold-=2;G.rerolls--;
 const cur=G.offers||[],sw=shuf(cur.filter(id=>!(shopPool().find(o=>o.id==id)||{}).keep)).slice(0,2);
 const fresh=shuf(shopPool().map(o=>o.id).filter(id=>!cur.includes(id))).slice(0,2);
 G.offers=cur.filter(id=>!sw.includes(id)).concat(fresh).slice(0,6);G.offerIx=0;
 G.msg=`🔄 2 fresh offers for 2 gold. ${G.rerolls} refresh${G.rerolls==1?'':'es'} left.`;snd(600,.06);render();
}
const back=`<button class="alt" onclick="G.cur=null;V='menu';render()">Back</button>`;
function shopScr(){if(V=='vc')return vcScr();if(V=='cn')return cnScr();if(V=='tr')return trScr();if(V=='mk')return mkScr();if(V=='rm')return rmScr();if(V=='lv2')return lv2Scr();if(V=='br')return brScr();
 if(V=='rare'){const r=G.rj;if(!r)return`<div class="box"><p>That offer is gone.</p><div class="row">${back}</div></div>`;
  return`<div class="box"><h3>🌟 ${r.e} ${r.n}</h3><p><b>ULTRA RARE.</b> ${r.d}</p><p>Price: ${RARE_PRICE} gold. Joker slots: ${G.jk.length}/${G.slots}.</p><div class="row">${back}<button class="gold" onclick="buyRare()" ${G.gold>=RARE_PRICE&&G.jk.length<G.slots?'':'disabled'}>Buy · ${RARE_PRICE} gold</button></div></div>`}
 if(V=='dev'){const d=G.dev;if(!d)return`<div class="box"><p>That deal is gone.</p><div class="row">${back}</div></div>`;
  return`<div class="dv"><b>😈 Devil's deal — no gold required.</b><br>${d.d}</div><div class="box"><h3>${d.e} ${d.n}</h3><p>There is no price in gold. The cost comes due later.</p><div class="row">${back}<button class="gold" onclick="takeDev()">Accept the deal</button></div></div>`}
 if(V=='cust'){
  let h=`<div class="box"><h3>Pick a card to upgrade</h3><p>Cost: ${cCost()} gold.</p>`;
  for(let s=0;s<4;s++){h+=`<div class="suit">${S[s]}</div><div class="grid">`;
   deck.map((c,i)=>[c,i]).filter(a=>a[0].s==s).sort((a,b)=>a[0].r-b[0].r).forEach(a=>{h+=cardH(a[0],a[0].id,'','pick','--d:0')});h+='</div>'}
  return h+`<div class="row">${back}</div></div>`;
 }
 if(V=='type'){
  const c=deck.find(x=>x.id==pc)||deck[0];
  return`<div class="box"><h3>Choose an upgrade for ${RK[c.r]}${S[c.s]}</h3><p>Cost: ${cCost()} gold.</p>
  <div class="tiles">${UPK.map(k=>`<button class="tile" style="min-height:0" onclick="setUp('${k}')" ${G.gold>=cCost()?'':'disabled'}><span class="ic">${UP[k][1]}</span><b>${UP[k][0]}</b><span class="ds">${UP[k][2]}</span></button>`).join('')}</div>
  <div class="row"><button class="alt" onclick="V='cust';render()">Back</button></div></div>`;
 }
 if(V=='lvl')return`<div class="box"><h3>📈 Random Level-Up</h3><p>A random common hand levels up: +15 chips, +1 mult. You don't get to choose which.</p>
  ${G.lv.some(x=>x)?`<p>${G.lv.map((x,i)=>x?`${HN[i]}: Lv ${x}`:'').filter(Boolean).join(' • ')}</p>`:''}<div class="row">${back}<button onclick="lvl()" ${G.gold>=lvC()?'':'disabled'}>Confirm · ${lvC()} gold</button></div></div>`;
 if(V=='sell'){
  const list=sellable();
  if(!list.length)return`<div class="box"><h3>💰 Sell a joker</h3><p>Nothing to sell here. Permanent blessings and the ultra-rare joker can never be sold.</p><div class="row">${back}</div></div>`;
  return`<div class="box"><h3>💰 Sell a joker</h3><p>Only in the last 3 rounds: cursed, corrupted and spent jokers can be released for gold. Permanent blessings are bound to you.</p><div class="tiles" style="grid-template-columns:1fr">${list.map(o=>`<button class="tile" onclick="sellJ(${o.i})"><span class="ic">${o.j.e}</span><b>${o.j.n}</b><span class="ds">${o.j.d}</span><small>Sell · +${sellPrice(o.j)} gold</small></button>`).join('')}</div><div class="row">${back}</div></div>`;
 }
 if(V=='jok')return`<div class="box"><h3>🃏 Joker</h3><p>You can't choose: it gives you a random joker for <b>up to ${jMax()} gold</b> (min ${jMin()}). Most are blessings, but cursed and corrupted jokers exist too (corrupted jokers change over time). Mortal jokers can be sold in the last 3 rounds; permanent blessings stay. Any gold above the price stays with you. Slots: ${G.jk.length}/${G.slots}</p>
  <div class="row">${back}<button onclick="joker()" ${G.gold>=jMin()&&G.jk.length<G.slots?'':'disabled'}>Confirm · ${jPrice()} gold</button></div></div>`;
 if(V=='box')return`<div class="box"><h3>🎲 Mystery Box</h3><p>Bet gold and spin the reel. The prize is never gold: it is upgraded card(s) added on top of your 52, a tarot card, or a joker. It is empty most of the time. A bigger bet improves your odds a little (up to 8 gold); 4+ gold gives 2 cards and 8+ gold gives 3.</p>
  <div class="reel" id="reel"><div class="mark"></div><div class="trk" id="trk">${reelItems(Array.from({length:12},rk))}</div></div>
  <div class="odds" id="odds">${oddsTxt()}</div>
  <div class="step"><button class="alt" onclick="bet(-1)">−</button><b id="bv">${G.bet}</b><button class="alt" onclick="bet(1)">+</button></div>
  <p class="note">1 spin per shop visit · 2 empties in a row guarantee a prize on the next spin.</p>
  <div class="row"><button class="alt" id="bk" onclick="G.cur=null;V='menu';render()">Back</button><button id="op" onclick="openBox()" ${(G.spins||0)>=1?'disabled':''}>Open the box</button></div></div>`;
 if(V=='done')return`<div class="row top"><button class="gold" onclick="goNext()">▶ Next Round</button></div>`;
 return`<div class="row top stick"><button class="gold" onclick="goNext()">▶ Next Round<small>${G.act} pick${G.act>1?'s':''} left, you may skip them</small></button></div><div class="scrl">${mapH()}<div class="npc"><div class="av">${portrait(MER)}</div><div class="bub">${merch()}</div></div>${bossInfo(1)}${salonInfo(1)}<div class="shophead"><b>Günün teklifleri</b><small>${G.act} pick · her seçim yeniler · ${G.rerolls} refresh · 2g</small></div><div class="navrow"><button class="alt" onclick="hstep('shopOffers',-1)">‹</button><small id="shopOffersPos">1 / 6</small><button class="alt" onclick="hstep('shopOffers',1)">›</button></div><div class="hscroll" id="shopOffers">
 ${(G.offers||[]).map(id=>{const o=shopPool().find(x=>x.id==id);return o?offerCard(o):''}).join('')}</div>
 <div class="row"><button class="alt" onclick="rerollShop()" ${G.rerolls>0&&G.gold>=2&&G.act>0?'':'disabled'}>🔄 Refresh offers · 2 gold<small>${G.rerolls} left · needs a pick</small></button></div></div>`;
}
function endScr(){if(G.ph=='won')return winScr();
 best=Math.max(best,G.round-1);save();
 return`<div class="scrl"><div class="over"><h2>GAME OVER</h2><p>You fell to ${dealer().n} in round ${G.round}.</p></div>${shareBox()}</div><div class="foot"><div class="snav"><button class="alt" onclick="scrlJump(-1)">↑ Top</button><button class="alt" onclick="scrlJump(1)">↓ End</button></div><div class="row"><button class="alt" onclick="goHome()">Main menu</button><button onclick="goDecks()">Try again</button></div></div>`;
}
function pick(i){pc=i;V='type';render()}
let mute=false,ac,jsel=-1,lh=null;
function snd(f,d=.1,ty='triangle',v=.05,sl=0){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function toggleMute(){mute=!mute;try{localStorage.setItem('kp_m',mute?'1':'')}catch(e){}if(mute)musicStop();else musicStart();render()}
let music=null,musicMs=900,musicBase=110,moodKey='';
function musicStart(){if(music||mute)return;music=setInterval(musicTick,musicMs)}
function musicStop(){if(music){clearInterval(music);music=null}}
function musicTick(){
 if(mute||!music||document.hidden||!ac||ac.state!=='running')return;
 const sc=[0,3,5,7,10,12],n=sc[Math.floor(Math.random()*sc.length)];
 snd(musicBase*Math.pow(2,n/12),1.15,'sine',.014);
 if(Math.random()<.22)snd(musicBase/2,1.7,'triangle',.009);
}
function musicMood(){
 const ing=typeof G!=='undefined'&&G&&scr=='game',k=ing?`g${G.round}${G.boss?1:0}`:'home';
 if(k===moodKey)return;moodKey=k;
 if(ing){musicMs=Math.max(520,940-G.round*28-(G.boss?70:0));musicBase=G.round>=14?98:G.boss?104:110}
 else{musicMs=1050;musicBase=98}
 if(music){musicStop();musicStart()}
}
document.addEventListener('pointerdown',()=>{if(!mute)musicStart()},{once:true});
function tween(el,a,b,ms){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
function fx(cls,txt,x,y){const d=document.createElement('div');d.className=cls;d.textContent=txt;if(x!=null){d.style.left=x+'px';d.style.top=y+'px'}document.body.appendChild(d);return d}
function banner(t,bad){const d=fx('bn'+(bad?' x':''),t);setTimeout(()=>d.remove(),1800)}
function popup(t){const r=document.querySelector('.scorebar');if(!r)return;const b=r.getBoundingClientRect(),d=fx('pop',t,b.left+b.width/2,b.bottom-4);setTimeout(()=>d.remove(),1200)}
function burst(){for(let i=0;i<22;i++){const d=fx('pt','🪙',innerWidth/2,innerHeight*.4),a=Math.random()*6.28,r=90+Math.random()*160;d.style.setProperty('--dx',Math.cos(a)*r+'px');d.style.setProperty('--dy',Math.sin(a)*r+60+'px');d.style.setProperty('--rt',(Math.random()*540-270)+'deg');setTimeout(()=>d.remove(),1100)}}
function shake(){const a=$('app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}
function reSel(){document.querySelectorAll('.hand .hc').forEach((el,j)=>el.classList.toggle('sel',sel.includes(j)))}
const jdTxt=()=>{const j=G.jk[jsel];return j?`<b>${j.n}</b> · ${j.d}${j.st?` · <b>now: ${j.st(j)}</b>`:j.k?` · level ${j.k}`:''}${j.r?` · now +${j.r}`:''}`:'Tap a joker to see what it does.'};
function showJ(i){if(!G.jk[i])return;jsel=jsel==i?-1:i;snd(620,.05);document.querySelectorAll('.jk').forEach((el,k)=>el.classList.toggle('on',k==jsel));$('jd').innerHTML=jdTxt()}
document.addEventListener('pointermove',e=>{
 if(e.pointerType=='touch')return;
 const hc=e.target.closest?e.target.closest('.hand .hc'):null;
 if(lh&&lh!==hc&&lh.firstChild){lh.firstChild.style.setProperty('--rx','0deg');lh.firstChild.style.setProperty('--ry','0deg')}
 lh=hc;if(!hc)return;
 const r=hc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5,c=hc.firstChild;
 c.style.setProperty('--rx',(-y*18)+'deg');c.style.setProperty('--ry',(x*18)+'deg');
});
let lk='',ENTER=false;
/* ---- v10.2: carousel, section tabs and keyboard control ---- */
function hstep(id,dir){
 const e=document.getElementById(id);if(!e)return;
 const step=(e.firstElementChild?e.firstElementChild.getBoundingClientRect().width:300)+12;
 e.scrollLeft=e.scrollLeft+dir*step;hsync(id);
}
function hsync(id){
 const e=document.getElementById(id);if(!e)return;
 const step=(e.firstElementChild?e.firstElementChild.getBoundingClientRect().width:300)+12;
 const i=Math.min(e.children.length,Math.max(1,Math.round(e.scrollLeft/step)+1));
 const lbl=document.getElementById(id+'Pos');if(lbl)lbl.textContent=i+' / '+e.children.length;
}
function scrlBy(dir,big){
 const e=document.querySelector('.scrl');if(!e)return;
 e.scrollBy({top:dir*(big?e.clientHeight*.8:190),behavior:'smooth'});
}
function scrlJump(dir){const e=document.querySelector('.scrl');if(!e)return;e.scrollTop=dir<0?0:e.scrollHeight}
let secCur='cards';
function jumpSec(name,dir){
 const ids=['cards','lv','mys','gear','bar'],e=document.querySelector('.scrl');if(!e)return;
 if(name)secCur=name;
 if(dir){const i=ids.indexOf(secCur);secCur=ids[(i+dir+ids.length)%ids.length]}
 const t=document.getElementById('sec-'+secCur);if(!t)return;
 const r=e.getBoundingClientRect(),tr=t.getBoundingClientRect();
 e.scrollTop=e.scrollTop+(tr.top-r.top)-8;var tb=document.getElementById('sectabs');if(tb)tb.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.s==secCur)});
}
function secsync(){
 const e=document.querySelector('.scrl'),tabs=document.getElementById('sectabs');if(!e||!tabs)return;
 const r=e.getBoundingClientRect();let cur='cards';
 ['cards','lv','mys','gear','bar'].forEach(n=>{const h=document.getElementById('sec-'+n);if(h&&h.getBoundingClientRect().top-r.top<=26)cur=n});
 secCur=cur;tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s==cur));
}
function postRender(){
 document.querySelectorAll('.hscroll').forEach(e=>{
  hsync(e.id);
  if(e.id=='shopOffers'){
   G.offerIx=Math.min(G.offerIx||0,Math.max(0,e.children.length-1));
   const card=e.children[G.offerIx];
   if(card&&G.offerIx)e.scrollLeft=card.offsetLeft-(e.clientWidth-card.offsetWidth)/2;
   hsync(e.id)
  }
 });
 secsync()
}
document.addEventListener('keydown',e=>{
 if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 const hs=document.querySelector('.hscroll'),hasTabs=!!document.getElementById('sectabs');
 if(e.key=='ArrowRight'){if(hs){e.preventDefault();hstep(hs.id,1)}else if(hasTabs){e.preventDefault();jumpSec('',1)}return}
 if(e.key=='ArrowLeft'){if(hs){e.preventDefault();hstep(hs.id,-1)}else if(hasTabs){e.preventDefault();jumpSec('',-1)}return}
 if(e.key=='ArrowDown'){e.preventDefault();scrlBy(1);return}
 if(e.key=='ArrowUp'){e.preventDefault();scrlBy(-1);return}
 if(e.key=='PageDown'){e.preventDefault();scrlBy(1,1);return}
 if(e.key=='PageUp'){e.preventDefault();scrlBy(-1,1);return}
 if(e.key=='End'){e.preventDefault();scrlJump(1);return}
 if(e.key=='Home'){e.preventDefault();scrlJump(-1)}
});
document.addEventListener('scroll',ev=>{
 const t=ev.target;if(!t||!t.classList)return;
 if(t.classList.contains('hscroll'))hsync(t.id);
 if(t.classList.contains('scrl'))secsync();
},true);
function render(){
 musicMood();
 let key,h;
 key=scr=='game'?'g'+G.ph+V+(G.intro?'i':''):scr;
 const an=key!=lk;lk=key;ENTER=an;
 document.body.classList.toggle('room',scr=='game'&&G.ph=='play');
 if(scr!='game')document.body.classList.remove('dead');
 if(scr!='game'){h=scr=='home'?homeScr():scr=='jokers'?collScr():scr=='decks'?deckScr():scr=='acs'?acScr():scr=='rivals'?rivScr():howScr()}
 else{
  h=jokerBar()+`<div class="top"><div class="stat"><small>Round ❤${G.lives}${G.boss&&G.ph=='play'?' 👑':''}</small><b>${G.endless?G.round:Math.min(G.round,MAXR)}<em>/${G.endless?'∞':MAXR}</em></b></div><div class="stat gold"><small>Gold</small><b id="gd">${G.gold}</b></div>${G.ph=='play'?`<div class="stat"><small>Hands</small><b>${G.hl}</b></div><div class="stat"><small>Discards</small><b>${G.dl}</b></div>`:''}<button class="ico" onclick="openInfo('deck')">📚</button><button class="ico" id="qb" onclick="quit()">✕</button></div>
 <div class="msg">${G.msg}</div>`+(G.ph=='play'?(G.intro?introScr():playScr()):G.ph=='shop'?shopScr():endScr());
 }
 $('app').innerHTML=`<div class="pgw${an?' in':''}">${h}</div>`;
 postRender();
  if(scr=='game'){fresh=new Set();reSel();pvu()}
}
load();try{mute=!!localStorage.getItem('kp_m')}catch(e){}render();
</script>
